name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Lint (non-blocking warnings)
        run: npm run lint --silent || echo "::warning::lint reported issues"
      - name: Typecheck (tsc)
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Unit tests (vitest — inclui guard do sitemap-problemas)
        run: npm run test:unit
      - name: CTA funnel gate
        run: npm run check:cta-funnel
      - name: Padronização operacional dos serviços (valor, prazo, escopo, fotos, agendamento)
        run: npm run check:service-specs
      - name: Consistência de preços x planilha oficial
        run: npm run check:price-consistency
      - name: AdSense gate (ads.txt + meta + consentimento)
        run: npm run check:adsense
      - name: Políticas — JSON-LD (WebPage, BreadcrumbList, FAQPage)
        run: npm run check:policy-jsonld
      - name: Cluster informática — JSON-LD sem verticais recusadas
        run: npm run check:cluster-jsonld
      - name: Feeds e sitemaps (XML válido, datas coerentes, sem data futura)
        run: npm run check:feeds
      - name: LGPD — ROPA sincronizado com as decisões 1–4
        run: npm run check:ropa
      - name: NAP consistente (telefone, horários e cidade x src/lib/nap.ts)
        run: npm run check:nap
      - name: LGPD — fotos sem EXIF/GPS/XMP (seguras para o site e o GBP)
        run: npm run check:photo-privacy
      - name: Alt text obrigatório e descritivo em todas as imagens
        run: npm run check:alt
      - name: Fotos otimizadas (WebP + AVIF responsivos, sem raster pesado sem variante)
        run: npm run check:photos



      - name: Build
        run: npm run build
      - name: Sitemap /problemas/* guard (189 unique)
        run: node scripts/check-sitemap-problemas.mjs
      - name: /problemas/* internal-link guard (whitelist canônica)
        run: node scripts/check-problemas-internal-links.mjs
      - name: PC assembly service gate (capacidades, política de peças, garantia, checklist)
        run: node scripts/check-pc-assembly-service.mjs
      - name: Visual wave 3Q gate (padrão de serviços, âncoras, CTAs e limites)
        run: node scripts/check-visual-wave-3q.mjs

      - name: Gate visual 3R (cluster de sintomas)
        run: node scripts/check-visual-wave-3r.mjs

      - name: Gate visual 3S (sistema empresarial)
        run: node scripts/check-visual-wave-3s.mjs

      - name: Gate visual 3T (propagação empresarial em serviços)
        run: node scripts/check-visual-wave-3t.mjs

      - name: Gate visual 3U (remoto, dados, montagem)
        run: node scripts/check-visual-wave-3u.mjs
      - name: Brand consistency (og:site_name / Organization.name / LocalBusiness.name)
        run: node scripts/check-brand-consistency.mjs
      - name: Créditos e licenças das fotos públicas (bloqueia IA / crédito ausente)
        run: npm run check:image-credits
      - name: Image sitemap (AVIF/WebP, sem duplicatas, assets válidos)
        run: |
          npm run sitemap:images
          git diff --quiet -- public/sitemap-images.xml || {
            echo "::error::public/sitemap-images.xml desatualizado — rode 'npm run sitemap:images' e commite."
            git --no-pager diff -- public/sitemap-images.xml | head -40
            exit 1
          }
      - name: Install Chromium for JSON-LD validation
        run: npx playwright install --with-deps chromium
      - name: JSON-LD validation
        run: npm run validate:jsonld

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Start preview
        run: npx vite preview --port 8080 &
        env:
          CI: "true"
      - name: Wait for server
        run: npx wait-on http://localhost:8080 --timeout 60000
      - name: Monitor SEO (404, redirects, canônico, noindex, duplicatas, diff de sitemap)
        env:
          BASE_URL: http://localhost:8080
        run: node scripts/check-seo-monitor.mjs
      - name: Sitemap URLs válidas (200 + canônico bate)
        env:
          BASE_URL: http://localhost:8080
          MAX_URLS: "80"
        run: node scripts/check-sitemap-urls.mjs

      - name: Piloto prerender (HTTP 200, redirects, canônico, meta social, JSON-LD)
        env:
          BASE_URL: http://localhost:8080
        run: node scripts/check-pilot-routes.mjs
      - name: Title/description únicos (serviço×cidade, bairros, blog)
        env:
          BASE_URL: http://localhost:8080
          MAX_URLS: "300"
        run: node scripts/check-title-meta-unique.mjs
      - name: Markup de preços (Offer/PriceSpecification × tabela visível)
        env:
          BASE_URL: http://localhost:8080
        run: |
          npx playwright install --with-deps chromium >/dev/null
          node scripts/check-price-schema.mjs
      - name: Slots patrocinados (disclosure, fora da dobra, SEO neutro)
        run: node scripts/check-ad-slots.mjs http://localhost:8080
      - name: Relatório de paridade FAQ × FAQPage (CSV público)

        env:
          BASE_URL: http://localhost:8080
          FAIL_ON_DIFF: "1"
        run: node scripts/report-faq-parity.mjs
      - name: Upload relatório de paridade FAQ
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: faq-parity
          path: |
            public/relatorios/faq-parity.csv
            docs/seo/faq-parity.md
          if-no-files-found: ignore
      - name: SEO /atendimento (title/desc/H1/JSON-LD)
        env:
          E2E_BASE_URL: http://localhost:8080
        run: node scripts/check-atendimento-seo.mjs
      - name: IndexNow infra + sitemap ping check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/check-indexnow-ping.mjs
      - name: Run targeted E2E (+ jsonld-presence + atendimento CTAs/FAQ/triage)
        run: npx playwright test e2e/whatsapp-funnel.spec.ts e2e/termos-e-condicoes.spec.ts e2e/seo-sitemap-robots.spec.ts e2e/como-funciona-mobile.spec.ts e2e/nap-consistency.spec.ts e2e/a11y-skiplink.spec.ts e2e/seo-h1.spec.ts e2e/seo-title-dedup.spec.ts e2e/funnel-mobile-no-skip.spec.ts e2e/jsonld-presence.spec.ts e2e/atendimento-whatsapp.spec.ts e2e/atendimento-symptom-triage.spec.ts e2e/atendimento-faq-jsonld.spec.ts e2e/localbusiness-jsonld.spec.ts e2e/breadcrumb-jsonld.spec.ts e2e/og-twitter-meta.spec.ts e2e/whatsapp-message-context.spec.ts e2e/whatsapp-prefill-fallback.spec.ts e2e/service-webpage-jsonld.spec.ts e2e/og-image-fallback.spec.ts e2e/service-gallery-order.spec.ts e2e/nap-consistency.spec.ts e2e/cta-accessibility.spec.ts e2e/business-wave-3t.spec.ts e2e/b2b-a11y-axe.spec.ts e2e/b2b-anchors-links.spec.ts e2e/funnel-console-gate.spec.ts e2e/consent-mode.spec.ts e2e/layout-quality.spec.ts --retries=1 --trace=retain-on-failure
        env:
          E2E_BASE_URL: http://localhost:8080
          CI: "true"


      - name: Upload titles-dump.csv on failure (seo-title-dedup)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: titles-dump
          path: test-results/**/titles-dump.csv
          if-no-files-found: ignore
      - name: Upload Playwright traces/screenshots on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/**/trace.zip
            test-results/**/*.png
          if-no-files-found: ignore

  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Start preview
        run: npx vite preview --port 8080 &
      - name: Wait for server
        run: npx wait-on http://localhost:8080 --timeout 60000
      - name: Axe a11y (fail em serious/critical)
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npx playwright test e2e/a11y-axe.spec.ts --reporter=list 2>&1 | tee a11y-report.log
      - name: Upload a11y report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: |
            a11y-report.log
            test-results/**/*
          if-no-files-found: ignore


  indexnow:
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect changes in service/neighborhood pages
        id: changes
        run: |
          set -e
          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD~1"
          fi
          changed=$(git diff --name-only "$base" HEAD || true)
          echo "$changed"
          if echo "$changed" | grep -qE '^(src/pages/(servicos|bairros|arrumar-pc|servico-bairro|cftv|hubs)/|src/pages/Tecnico|src/pages/Conserto|public/sitemap)'; then
            echo "ping=true" >> "$GITHUB_OUTPUT"
          else
            echo "ping=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sem mudanças em páginas de serviço/bairro/sitemap — IndexNow pulado."
          fi
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.ping == 'true'
        with:
          node-version: "20"
      - name: Ping IndexNow with sitemap URLs
        if: steps.changes.outputs.ping == 'true'
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          INDEXNOW_HOST: tecnicocuritiba.com.br
        run: |
          if [ -z "$INDEXNOW_KEY" ]; then
            echo "::warning::INDEXNOW_KEY ausente — pulando ping."
            exit 0
          fi
          node scripts/indexnow-ping.mjs

  seo-deploy-hook:
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Reenviar sitemaps ao Search Console + validar canônicos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL/ANON_KEY ausentes — pós-deploy de SEO pulado."
            exit 0
          fi
          curl -sS --fail-with-body -X POST \
            "$SUPABASE_URL/functions/v1/seo-deploy-hook" \
            -H "Content-Type: application/json" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -d '{"origem":"deploy"}' | tee seo-deploy-hook.json


  lighthouse:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Install Lighthouse CI
        run: npm i -g @lhci/cli@0.13.x
      - name: Build
        run: npm run build
      - name: Lighthouse (desktop + mobile, non-blocking)
        run: |
          npm run lh:desktop || echo "::warning::lh desktop falhou"
          npm run lh:mobile || echo "::warning::lh mobile falhou"
      - name: Core Web Vitals guard (bloqueia LCP/CLS/INP piores que o limite)
        run: npm run cwv:guard
      - name: Upload Lighthouse reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore



  jsonld-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Build
        run: npm run build
      - name: Start preview
        run: npx vite preview --port 8080 &
      - name: Wait for server
        run: npx wait-on http://localhost:8080 --timeout 60000
      - name: Audit JSON-LD (/obrigado + /problemas/*)
        env:
          BASE_URL: http://localhost:8080
        run: node scripts/audit-jsonld-obrigado-problemas.mjs | tee jsonld-audit.log
      - name: Upload JSON-LD audit log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: jsonld-audit
          path: jsonld-audit.log
          if-no-files-found: ignore

  ga4-utms:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Start preview
        run: npx vite preview --port 8080 &
      - name: Wait for server
        run: npx wait-on http://localhost:8080 --timeout 60000
      - name: Validate GA4 UTMs (origem/bairro/servico)
        env:
          BASE_URL: http://localhost:8080
        run: node scripts/validate-ga4-utms.mjs | tee ga4-utms.log
      - name: Upload GA4/UTM log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ga4-utms
          path: ga4-utms.log
          if-no-files-found: ignore

  lighthouse-heavy-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Cache Lighthouse + Chromium (reduz variação de transferência)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/lighthouse
            ~/.cache/ms-playwright
            ~/.npm
            ~/.cache/puppeteer
          key: lh-heavy-${{ runner.os }}-${{ hashFiles('scripts/lh-heavy-posts.mjs') }}
          restore-keys: |
            lh-heavy-${{ runner.os }}-
      - name: Install Lighthouse
        run: npm i -g lighthouse@12
      - name: Run Lighthouse (10 heavy posts, mobile + desktop) with regression gate
        env:
          BASE_URL: https://tecnicocuritiba.com.br
          MAX_LCP_REGRESSION_MS: "400"
          MAX_BYTES_REGRESSION_PCT: "15"
          LH_FAIL_ON_REGRESSION: "1"
        run: node scripts/lh-heavy-posts.mjs
      - name: Upload Lighthouse heavy-posts artifacts (JSON + MD + HTML)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lh-heavy-posts
          path: |
            docs/perf/heavy-posts-latest.json
            docs/perf/heavy-posts-diff.md
            docs/perf/heavy-posts-report.html
            docs/perf/heavy-posts-baseline.json
            docs/perf/heavy-posts-slugs.json
          if-no-files-found: ignore

  perf-local-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Install Lighthouse
        run: npm i -g lighthouse@12
      - name: Build
        run: npm run build
      - name: Start preview
        run: npx vite preview --port 8080 &
      - name: Wait for server
        run: npx wait-on http://localhost:8080 --timeout 60000
      - name: Lighthouse páginas de bairro/cidade (LCP/CLS/TBT + gate de regressão)
        env:
          BASE_URL: http://localhost:8080
          SAMPLE: "8"
          LH_FAIL_ON_REGRESSION: "1"
        run: node scripts/lh-local-pages.mjs
      - name: Upload relatório de performance local
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: perf-local-pages
          path: |
            docs/perf/local-pages-latest.json
            docs/perf/local-pages-diff.md
          if-no-files-found: ignore

  images-404:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Build
        run: npm run build
      - name: Start preview
        run: npx vite preview --port 8080 &
      - name: Wait for server
        run: npx wait-on http://localhost:8080 --timeout 60000
      - name: Crawl /blog + /problemas/* for broken images/fonts/CSS
        env:
          BASE_URL: http://localhost:8080
          SAMPLE: "25"
        run: node scripts/check-images-404.mjs | tee images-404.log
      - name: Upload images-404 log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: images-404
          path: images-404.log
          if-no-files-found: ignore

  pr-summary:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [lighthouse-heavy-posts, images-404]
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Baixar artefatos de perf/imagens
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Montar resumo
        id: build
        run: |
          {
            echo "## 📊 Resultados de CI — perf & assets"
            echo ""
            if [ -f artifacts/heavy-posts-diff.md ]; then
              echo "### Lighthouse (heavy posts)"
              head -c 6000 artifacts/heavy-posts-diff.md
              echo ""
            else
              echo "_Lighthouse diff indisponível._"
            fi
            echo ""
            if [ -f artifacts/images-404.log ]; then
              echo "### Crawler de assets (imagens/fontes/CSS)"
              echo '```'
              tail -c 3000 artifacts/images-404.log
              echo '```'
            fi
          } > pr-summary.md
      - name: Comentar no PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ci-perf-summary
          path: pr-summary.md


