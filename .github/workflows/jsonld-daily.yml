name: JSON-LD Rich Results daily check

on:
  schedule:
    # Todo dia às 07:00 BRT (10:00 UTC)
    - cron: "0 10 * * *"
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Validar JSON-LD LocalBusiness/WebSite em produção
        env:
          BASE_URL: https://tecnicocuritiba.com.br
        run: node scripts/validate-jsonld.mjs
      - name: Notificar falha (issue)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `[SEO] JSON-LD Rich Results falhou em produção (${new Date().toISOString().slice(0,10)})`;
            const body = [
              `A validação diária de JSON-LD contra https://tecnicocuritiba.com.br falhou.`,
              ``,
              `Rotas auditadas: home, hub principal, bairros top e serviços top.`,
              `Ver logs do job: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `Próximos passos:`,
              `1. Rodar Rich Results Test em https://search.google.com/test/rich-results?url=https://tecnicocuritiba.com.br/`,
              `2. Verificar Search Console → Aprimoramentos → LocalBusiness`,
              `3. Corrigir o componente JsonLdSchema ou o schema da rota afetada`,
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["seo", "regression"],
            });
