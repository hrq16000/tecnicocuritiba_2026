name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit + secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Detect dependency graph changes in PR
        id: deps
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || git fetch origin "$BASE_SHA" --depth=1

          if git diff --name-only "$BASE_SHA...HEAD" | grep -qx 'bun.lock'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node - "$BASE_SHA" <<'NODE'
          const { execFileSync } = require("node:child_process");
          const fs = require("node:fs");
          const base = process.argv[2];
          const current = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const previous = JSON.parse(execFileSync("git", ["show", `${base}:package.json`], { encoding: "utf8" }));
          const keys = ["dependencies", "devDependencies", "optionalDependencies", "peerDependencies", "overrides", "resolutions"];
          const pick = (pkg) => Object.fromEntries(keys.map((k) => [k, pkg[k] || {}]));
          const changed = JSON.stringify(pick(current)) !== JSON.stringify(pick(previous));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `changed=${changed}\n`);
          NODE

      # Full audit is always collected. Existing debt is reported on main/schedule;
      # a PR is blocked only when it changes the dependency graph and leaves
      # high/critical vulnerabilities in the canonical bun.lock.
      - name: Bun audit report (high+critical)
        id: bun_audit
        continue-on-error: true
        run: |
          set -o pipefail
          bun audit --audit-level=high 2>&1 | tee bun-audit.txt

      - name: Upload Bun audit report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: bun-audit-report
          path: bun-audit.txt
          retention-days: 14

      - name: Enforce Bun audit when dependencies changed
        if: github.event_name == 'pull_request' && steps.deps.outputs.changed == 'true' && steps.bun_audit.outcome == 'failure'
        run: |
          echo "A PR alterou package.json/bun.lock e mantém vulnerabilidades high/critical."
          exit 1

      # PR gate scans the current tree, not historical commits. Historical leaks
      # remain visible via the scheduled report below, without blocking unrelated fixes.
      - name: Gitleaks current tree
        id: gitleaks
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            detect --source=/repo --no-git --redact --verbose \
            --report-format json --report-path /repo/gitleaks-current.json \
            --exit-code=1

      - name: Summarize Gitleaks findings (redacted)
        if: always()
        run: |
          if [ -f gitleaks-current.json ]; then
            node - <<'NODE'
          const fs = require("node:fs");
          const findings = JSON.parse(fs.readFileSync("gitleaks-current.json", "utf8"));
          console.log(`Gitleaks findings: ${findings.length}`);
          for (const f of findings) {
            console.log(`- ${f.File || "?"}:${f.StartLine || "?"} · ${f.RuleID || "unknown"}`);
          }
          NODE
          fi

      - name: Upload Gitleaks report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-current-report
          path: gitleaks-current.json
          retention-days: 14

      - name: Enforce Gitleaks current tree
        if: always() && steps.gitleaks.outcome == 'failure'
        run: |
          echo "Gitleaks encontrou segredo(s) no tree atual."
          exit 1

      - name: Gitleaks history report
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            detect --source=/repo --redact --exit-code=1

      - name: Install Semgrep CE
        run: python3 -m pip install --disable-pip-version-check "semgrep==1.178.0"

      # Differential scan on PRs: only findings introduced since main block merge.
      # Full scan on main/schedule is observability for legacy debt.
      - name: Semgrep PR differential
        if: github.event_name == 'pull_request'
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || git fetch origin "$BASE_SHA" --depth=1
          semgrep scan \
            --config=p/owasp-top-ten \
            --config=p/javascript \
            --config=p/typescript \
            --config=p/react \
            --baseline-commit "$BASE_SHA" \
            --error \
            src scripts supabase

      - name: Semgrep full report
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          semgrep scan \
            --config=p/owasp-top-ten \
            --config=p/javascript \
            --config=p/typescript \
            --config=p/react \
            --error \
            src scripts supabase

      - name: Verify security headers in public/_headers
        run: bun scripts/check-security-headers.ts

      - name: Verify every public-schema CREATE TABLE has RLS + GRANT
        run: bun scripts/check-rls-migrations.ts

      - name: Verify SEO basics on index.html
        run: bun scripts/check-seo-basics.ts index.html
