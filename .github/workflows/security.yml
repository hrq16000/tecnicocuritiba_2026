name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit + secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Canonical dependency audit: this repository is locked by bun.lock.
      # Keep the result blocking, but run the independent checks as well.
      - name: Bun audit (high+critical)
        id: bun_audit
        continue-on-error: true
        run: |
          set -o pipefail
          bun audit --audit-level=high 2>&1 | tee bun-audit.txt

      - name: Upload Bun audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bun-audit-report
          path: bun-audit.txt
          retention-days: 14

      # OSS CLI scan avoids the organization-license requirement introduced by
      # gitleaks/gitleaks-action@v2 while keeping the same secret gate.
      - name: Gitleaks secret scan
        if: always()
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            detect --source=/repo --redact --exit-code=1

      # The previous returntocorp/semgrep-action image bundled Semgrep 1.36,
      # which cannot parse current registry severities. Pin a current CE CLI.
      - name: Install Semgrep CE
        if: always()
        run: python3 -m pip install --disable-pip-version-check "semgrep==1.178.0"

      - name: Semgrep (OWASP/React rulesets)
        if: always()
        run: |
          semgrep scan \
            --config=p/owasp-top-ten \
            --config=p/javascript \
            --config=p/typescript \
            --config=p/react \
            --error \
            .

      - name: Verify security headers in public/_headers
        if: always()
        run: bun scripts/check-security-headers.ts

      - name: Verify every public-schema CREATE TABLE has RLS + GRANT
        if: always()
        run: bun scripts/check-rls-migrations.ts

      - name: Verify SEO basics on index.html
        if: always()
        run: bun scripts/check-seo-basics.ts index.html

      - name: Enforce Bun audit high+critical
        if: always() && steps.bun_audit.outcome == 'failure'
        run: |
          echo "bun audit encontrou vulnerabilidade high/critical no bun.lock canônico."
          exit 1
