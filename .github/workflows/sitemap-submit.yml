name: sitemap-health

on:
  push:
    branches: [main]
    paths:
      - "public/sitemap*.xml"
      - "public/robots.txt"
      - "scripts/generate-sitemap*.mjs"
      - "scripts/generate-sitemap*.ts"
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

concurrency:
  group: sitemap-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate production sitemap
        shell: bash
        run: |
          set -euo pipefail
          SITEMAP="https://tecnicocuritiba.com.br/sitemap.xml"
          BODY="$(mktemp)"
          CODE="$(curl -sS -L -o "$BODY" -w "%{http_code}" "$SITEMAP")"

          echo "Production sitemap HTTP $CODE"
          test "$CODE" = "200"
          grep -Eq '<(sitemapindex|urlset)([[:space:]>])' "$BODY"
          grep -q 'tecnicocuritiba.com.br' "$BODY"

          echo "✓ sitemap.xml disponível e parseável em produção"

      - name: Validate robots sitemap reference
        shell: bash
        run: |
          set -euo pipefail
          ROBOTS="$(curl -fsSL https://tecnicocuritiba.com.br/robots.txt)"
          printf '%s\n' "$ROBOTS" | grep -q 'Sitemap: https://tecnicocuritiba.com.br/sitemap.xml'
          echo "✓ robots.txt referencia o sitemap canônico"

      - name: Search engine submission policy
        run: |
          echo "Google/Bing sitemap ping endpoints foram removidos por obsolescência."
          echo "Google Search Console é atualizado pelo GSC Wizard/fluxo SEO externo."
          echo "IndexNow de URLs alteradas permanece no job dedicado do CI principal."
