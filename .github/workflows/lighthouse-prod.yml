name: lighthouse-prod
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Lighthouse
        run: npm i -g lighthouse@12
      - name: Wait a bit for deploy to propagate
        run: sleep 60
      - name: Run Lighthouse against production (mobile)
        run: |
          lighthouse https://tecnicocuritiba.com.br/ \
            --output=json --output=html \
            --output-path=./lh-mobile \
            --form-factor=mobile --quiet --chrome-flags="--headless --no-sandbox" || true
      - name: Run Lighthouse against production (desktop)
        run: |
          lighthouse https://tecnicocuritiba.com.br/ \
            --output=json --output=html \
            --output-path=./lh-desktop \
            --preset=desktop --quiet --chrome-flags="--headless --no-sandbox" || true
      - name: Compare with baseline
        run: |
          node <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const BASELINE = '.lighthouse-baseline.json';
          const baseline = fs.existsSync(BASELINE)
            ? JSON.parse(fs.readFileSync(BASELINE, 'utf8'))
            : { mobile: {}, desktop: {} };
          const readMetrics = (file) => {
            if (!fs.existsSync(file)) return null;
            const r = JSON.parse(fs.readFileSync(file, 'utf8'));
            const a = r.audits || {};
            return {
              LCP: a['largest-contentful-paint']?.numericValue ?? null,
              TBT: a['total-blocking-time']?.numericValue ?? null,
              CLS: a['cumulative-layout-shift']?.numericValue ?? null,
              score: r.categories?.performance?.score ?? null,
            };
          };
          const current = {
            mobile: readMetrics('./lh-mobile.report.json'),
            desktop: readMetrics('./lh-desktop.report.json'),
          };
          console.log('Atual:', JSON.stringify(current, null, 2));
          console.log('Baseline:', JSON.stringify(baseline, null, 2));
          const regressions = [];
          for (const ff of ['mobile','desktop']) {
            const b = baseline[ff] || {}; const c = current[ff] || {};
            if (b.LCP && c.LCP && c.LCP > b.LCP * 1.10) regressions.push(`${ff} LCP +${((c.LCP/b.LCP-1)*100).toFixed(1)}%`);
            if (b.TBT != null && c.TBT != null && c.TBT > b.TBT + 50 && c.TBT > b.TBT * 1.20) regressions.push(`${ff} TBT ${b.TBT}→${c.TBT}`);
            if (b.CLS != null && c.CLS != null && c.CLS > b.CLS + 0.02) regressions.push(`${ff} CLS ${b.CLS}→${c.CLS}`);
          }
          fs.writeFileSync('./lh-current.json', JSON.stringify(current, null, 2));
          if (regressions.length) {
            console.error('::warning::Regressões detectadas: ' + regressions.join(' | '));
          } else {
            console.log('Sem regressões em LCP/TBT/CLS vs baseline.');
          }
          EOF
      - name: Upload artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-prod-reports
          path: |
            lh-mobile.report.html
            lh-mobile.report.json
            lh-desktop.report.html
            lh-desktop.report.json
            lh-current.json
          if-no-files-found: ignore
